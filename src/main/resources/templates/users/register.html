<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="fragments/header :: header"></head>
<body>
<div class="container">
    <div class="row">
        <div class="col-3"></div>
        <div class="col-6">
            <form class="mt-3" method="post" th:action="@{/users/register}">

                <div class="mb-3" th:if="${error}">
                    <p class="text-danger" th:text="${error}"></p>
                </div>

                <div class="mb-3">
                    <label class="form-label" for="name"><b>Имя</b></label>
                    <input class="form-control" id="name" name="name"
                           placeholder="Иван" required type="text">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="login"><b>Логин</b></label>
                    <input class="form-control" id="login" name="login"
                           placeholder="Ivan777" required type="text">
                </div>

                <div class="mb-3">
                    <label class="form-label" for="password"><b>Пароль</b></label>
                    <input class="form-control" id="password"
                           name="password" required type="password">
                </div>

                <div class="mb-3 row justify-content-between align-items-center">
                    <div class="col-md-6">
                        <p class="mb-0">Уже зарегистрированы?
                            <a th:href="@{/users/login}">Войти</a>
                        </p>
                    </div>
                    <div class="col-md-6 d-flex justify-content-end">
                        <a class="btn btn-danger mr-2" th:href="@{/}">Отмена</a>
                        <button class="btn btn-primary " type="submit">Зарегистрироваться</button>
                    </div>
                </div>

            </form>
        </div>
        <div class="col-2"></div>
    </div>
</div>
</body>
</html>
