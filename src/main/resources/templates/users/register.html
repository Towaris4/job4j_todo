<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="fragments/header :: header"></head>
<body>
<div class="container">
    <div class="row">
        <div class="col-2"></div>
        <div class="col-8">
            <form class="mt-3" th:action="@{/users/register}" method="post">

                <div class="mb-3" th:if="${error}">
                    <p class="text-danger" th:text="${error}"></p>
                </div>

                <div class="mb-3">
                    <label for="name" class="form-label"><b>Имя</b></label>
                    <input type="text" class="form-control" id="name"
                           name="name" placeholder="Иван" required>
                </div>

                <div class="mb-3">
                    <label for="login" class="form-label"><b>Логин</b></label>
                    <input type="text" class="form-control" id="login"
                           name="login" placeholder="Ivan777" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label"><b>Пароль</b></label>
                    <input type="password" class="form-control"
                           id="password" name="password" required>
                </div>

                <div class="mb-3 row justify-content-between align-items-center">
                    <div class="col-md-6">
                        <p class="mb-0">Уже зарегистрированы?
                            <a th:href="@{/users/login}">Войти</a>
                        </p>
                    </div>
                    <div class="col-md-6 d-flex justify-content-end">
                        <a th:href="@{/}" class="btn btn-danger mr-2">Отмена</a>
                        <button class="btn btn-primary " type="submit">Зарегистрироваться</button>
                    </div>
                </div>

            </form>
        </div>
        <div class="col-2"></div>
    </div>
</div>
</body>
</html>
