<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Список задач</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1>Список задач</h1>

<!-- 2. Кнопка "Добавить задание" и 3. Ссылки-фильтры -->
<div class="mb-4 d-flex align-items-center gap-2">
    <a th:href="@{/tasks(filter='all')}" class="btn btn-outline-primary"
       th:classappend="${filter == null or filter == 'all'} ? ' active'">Все</a>
    <a th:href="@{/tasks(filter='new')}" class="btn btn-outline-primary"
       th:classappend="${filter == 'new'} ? ' active'">Новые</a>
    <a th:href="@{/tasks(filter='done')}" class="btn btn-outline-primary"
       th:classappend="${filter == 'done'} ? ' active'">Выполненные</a>
    <a th:href="@{/tasks/create}" class="btn btn-success ms-3">Добавить задание</a>
</div>

<table class="table table-striped table-hover">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Описание</th>
        <th>Дата создания</th>
        <th>Состояние</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="task : ${tasks}">
        <td th:text="${task.id}"></td>
        <!-- 4. Клик по названию -> детали -->
        <td><a th:href="@{/tasks/{id}(id=${task.id})}" th:text="${task.description}"></a></td>
        <td th:text="${#temporals.format(task.created, 'dd.MM.yyyy HH:mm')}"></td>
        <td th:text="${task.done} ? '✅ Выполнено' : '🆕 Новое'"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
