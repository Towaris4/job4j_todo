<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Детали задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1>Детали задачи #<span th:text="${task.id}"></span></h1>
<div class="card p-4 mt-3">
<p><strong>Тема:</strong> <span th:text="${task.title} ?: 'Без названия'"></span></p>

<!-- Безопасное обращение к priority -->
<p><strong>Приоритет:</strong>
    <span th:text="${task.priority?.name} ?: 'Не указан'"></span>
</p>

<!-- Безопасная работа с коллекцией категорий -->
<p><strong>Категории:</strong>
    <span th:each="cat : ${task.categories ?: T(java.util.Collections).emptyList()}"
          th:text="${cat.name}"
          class="badge bg-primary me-1 mb-1"></span>
    <span th:if="${task.categories == null or #lists.isEmpty(task.categories)}"
          class="text-muted fst-italic">Категории не выбраны</span>
</p>

<p><strong>Описание:</strong> <span th:text="${task.description} ?: '—'"></span></p>

<!-- Безопасное форматирование даты -->
<p><strong>Создана:</strong>
    <span th:text="${task.created != null ? #temporals.format(task.created, 'dd.MM.yyyy HH:mm') : 'Дата не указана'}"></span>
</p>

<p><strong>Состояние:</strong>
    <span class="fw-bold" th:text="${task.done} ? 'Выполнено' : 'В работе'"></span>
</p>
</div>

<!-- 5. Кнопки действий -->
<div class="mt-4 d-flex gap-2">
    <!-- 6. Выполнено (скрыта, если уже выполнено) -->
    <form method="post" th:action="@{/tasks/{id}/done(id=${task.id})}" th:unless="${task.done}">
        <button class="btn btn-success" type="submit">✅ Выполнено</button>
    </form>

    <!-- 7. Редактировать -->
    <a class="btn btn-warning" th:href="@{/tasks/{id}/edit(id=${task.id})}">✏️ Редактировать</a>

    <!-- 8. Удалить -->
    <form method="post" onsubmit="return confirm('Точно удалить задачу?');"
          th:action="@{/tasks/{id}/delete(id=${task.id})}">
        <button class="btn btn-danger" type="submit">🗑️ Удалить</button>
    </form>

    <a class="btn btn-secondary ms-auto" th:href="@{/tasks}">← Назад к списку</a>
</div>
</body>
</html>
