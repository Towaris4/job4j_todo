<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Детали задачи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1>Детали задачи #<span th:text="${task.id}"></span></h1>
<div class="card p-4 mt-3">
    <p><strong>Описание:</strong> <span th:text="${task.description}"></span></p>
    <p><strong>Создана:</strong> <span th:text="${#temporals.format(task.created, 'dd.MM.yyyy HH:mm')}"></span></p>
    <p><strong>Статус:</strong> <span th:text="${task.done} ? 'Выполнено' : 'В работе'" class="fw-bold"></span></p>
</div>

<!-- 5. Кнопки действий -->
<div class="mt-4 d-flex gap-2">
    <!-- 6. Выполнено (скрыта, если уже выполнено) -->
    <form th:action="@{/tasks/{id}/done(id=${task.id})}" method="post" th:unless="${task.done}">
        <button type="submit" class="btn btn-success">✅ Выполнено</button>
    </form>

    <!-- 7. Редактировать -->
    <a th:href="@{/tasks/{id}/edit(id=${task.id})}" class="btn btn-warning">✏️ Редактировать</a>

    <!-- 8. Удалить -->
    <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" onsubmit="return confirm('Точно удалить задачу?');">
        <button type="submit" class="btn btn-danger">🗑️ Удалить</button>
    </form>

    <a th:href="@{/tasks}" class="btn btn-secondary ms-auto">← Назад к списку</a>
</div>
</body>
</html>
