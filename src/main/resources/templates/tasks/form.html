<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Задание</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 th:text="${task.id == null} ? 'Добавить задание' : 'Редактировать задание'"></h1>

<!-- Форма отправляет на create или update в зависимости от наличия id -->
<form th:action="${task.id == null} ? @{/tasks/create} : @{/tasks/update}" method="post" th:object="${task}">
    <input type="hidden" th:field="*{id}" />
    <div class="mb-3">
        <label class="form-label">Описание</label>
        <input type="text" class="form-control" th:field="*{description}" required />
    </div>
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a th:href="${task.id == null} ? @{/tasks} : @{/tasks/{id}(id=${task.id})}" class="btn btn-secondary ms-2">Отмена</a>
</form>
</body>
