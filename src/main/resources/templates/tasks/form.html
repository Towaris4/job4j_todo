<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Задание</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<h1 th:text="${task.id == null} ? 'Добавить задание' : 'Редактировать задание'"></h1>

<!-- Форма отправляет на create или update в зависимости от наличия id -->
<form method="post" th:action="${task.id == null} ? @{/tasks/create} : @{/tasks/update}" th:object="${task}">
    <input th:field="*{id}" type="hidden"/>
    <div class="mb-3">
        <label class="form-label">Тема</label>
        <input class="form-control" required th:field="*{title}" type="text"/>
    </div>
    <div class="mb-3">
        <label class="form-label">Описание</label>
        <textarea class="form-control" required th:field="*{description}" rows="5" cols="50"></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Сохранить</button>
    <a class="btn btn-secondary ms-2"
       th:href="${task.id == null} ? @{/tasks} : @{/tasks/{id}(id=${task.id})}">Отмена</a>
</form>
</body>
